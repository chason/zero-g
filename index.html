<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zero-g</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
      canvas { display: block; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #7fd4c1;
        /* phosphor: a tight bright core and a wider soft halo, like the strokes in the scene */
        text-shadow: 0 0 1px rgba(200,255,240,.9), 0 0 6px rgba(127,212,193,.55), 0 0 14px rgba(127,212,193,.25);
      }
      #hud .inst { filter: drop-shadow(0 0 3px rgba(127,212,193,.45)); }
      /* each instrument owns one .inst and positions itself inside the layer */
      #hud .inst { position: absolute; white-space: pre; }
      /* rotation readout (#18): lower-left, where a pilot glances. Brightness tracks the
         displayed magnitude via classes the instrument toggles on each row. */
      #hud .inst-rotation { left: 16px; bottom: 16px; }
      #hud .inst-rotation .rot-head { opacity: .55; }
      #hud .inst-rotation .rate-dim { opacity: .45; }
      #hud .inst-rotation .rate-live { opacity: 1; }
      #hud .inst-rotation .rate-alert { opacity: 1; color: #ffb347; font-weight: 700; }
      /* #19: speed, range and closing rate relative to the target; glanced at constantly on approach */
      #hud .inst-velocity { top: 16px; left: 50%; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
      /* #22: propellant, current mass and remaining delta-v */
      #hud .inst-propellant { right: 16px; bottom: 16px; font-variant-numeric: tabular-nums; }
      #hud .inst-propellant .bar { height: 6px; margin: 2px 0; border: 1px solid currentColor; box-sizing: border-box; }
      #hud .inst-propellant .fill { height: 100%; width: 100%; background: currentColor; }
      /* #20 prograde/retrograde markers: zero-size anchor at the layer origin; glyphs are
         moved with transform: translate() in screen px so no frame re-runs layout */
      #hud .inst-markers { left: 0; top: 0; width: 0; height: 0; overflow: visible; }
      #hud .marker {
        position: absolute; left: 0; top: 0; font-size: 22px; line-height: 1;
        will-change: transform;
      }
      #hud .marker-prograde { color: #a8ff9e; }
      #hud .marker-retrograde { color: #ffb36b; }
      /* clamped to the viewport edge: the shortest turn toward it, not where it is */
      #hud .marker.is-edge { opacity: .55; }
      /* #21 target bracket + edge arrow: same zero-size anchor, moved with translate() */
      #hud .inst-target { left: 0; top: 0; width: 0; height: 0; overflow: visible; }
      #hud .tgt-bracket { position: absolute; left: 0; top: 0; will-change: transform; }
      #hud .tgt-tick { position: absolute; width: 28%; height: 28%; border: 0 solid currentColor; }
      #hud .tgt-tick.tl { left: 0; top: 0; border-top-width: 1.5px; border-left-width: 1.5px; }
      #hud .tgt-tick.tr { right: 0; top: 0; border-top-width: 1.5px; border-right-width: 1.5px; }
      #hud .tgt-tick.bl { left: 0; bottom: 0; border-bottom-width: 1.5px; border-left-width: 1.5px; }
      #hud .tgt-tick.br { right: 0; bottom: 0; border-bottom-width: 1.5px; border-right-width: 1.5px; }
      #hud .tgt-name { position: absolute; left: 100%; top: 0; margin-left: 8px; white-space: nowrap; }
      #hud .tgt-arrow { position: absolute; left: 0; top: 0; will-change: transform; }
      /* CSS triangle pointing +x, tip at the arrow's origin (the edge point), rotated about the tip */
      #hud .tgt-arrow-head {
        position: absolute; left: -16px; top: -7px; width: 0; height: 0;
        border-top: 7px solid transparent; border-bottom: 7px solid transparent;
        border-left: 16px solid currentColor;
        transform-origin: 16px 7px;
      }
      #hud .tgt-arrow-name { position: absolute; left: 0; top: 0; white-space: nowrap; }
      /* #32 thruster schematic: lower-centre, clear of the corners a blackout vignette eats first */
      #hud .inst-thrusters { left: 50%; bottom: 28px; transform: translateX(-50%); }
      #hud .inst-thrusters svg { display: block; overflow: visible; }
      #hud .inst-thrusters .thr-frame { fill: none; stroke: currentColor; stroke-width: 1; opacity: .28; }
      #hud .inst-thrusters .thr-label { fill: currentColor; stroke: none; font-size: 9px; letter-spacing: .12em; opacity: .55; }
      /* dim outline of every thruster, always visible */
      #hud .inst-thrusters .thr-off { fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; opacity: .32; }
      #hud .inst-thrusters .thr-off .thr-dot { fill: currentColor; stroke: none; }
      /* lit copy per thruster; the instrument writes each one's opacity from its throttle */
      #hud .inst-thrusters .thr-on { fill: none; stroke: #eafff7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px #7fd4c1); }
      #hud .inst-thrusters .thr-on .thr-dot { fill: #eafff7; stroke: none; }
      /* #26 run summary: centred panel, hidden until the sim has decided the run */
      #hud .inst-summary {
        left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 14px 20px; border: 1px solid currentColor; background: rgba(5, 6, 10, .78);
        font-variant-numeric: tabular-nums;
      }
      #hud .inst-summary .sum-head { font-size: 28px; line-height: 1.2; letter-spacing: .18em; font-weight: 700; text-align: center; margin-bottom: 10px; }
      #hud .inst-summary.sum-dock .sum-head { color: #a8ff9e; }
      #hud .inst-summary.sum-crash .sum-head, #hud .inst-summary.sum-blackout .sum-head { color: #ffb347; }
      /* the row that broke a docking limit */
      #hud .inst-summary .sum-over { color: #ffb347; font-weight: 700; }
      #hud .inst-summary .sum-hint { margin-top: 12px; opacity: .55; letter-spacing: .08em; }
      #hud .inst-boresight { inset: 0; }
      #hud .inst-boresight .bore-ring {
        position: absolute; left: -9px; top: -9px; width: 16px; height: 16px;
        border: 1px solid rgba(127,212,193,.85); border-radius: 50%;
        box-shadow: 0 0 4px rgba(0,0,0,.9);
      }
      #hud .inst-boresight .bore-ring::after {
        content: ''; position: absolute; left: 7px; top: 7px; width: 2px; height: 2px;
        background: rgba(127,212,193,.85);
      }
      #hud .inst-boresight .bore-text {
        position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%);
        opacity: .8; letter-spacing: .04em;
      }
      #hud .inst-boresight .bore-text.bore-aligned { color: #b8ffd9; opacity: 1; }
      /* #56 options menu: Esc. Sits over the HUD, takes the mouse, pauses the sim while open. */
      #menu {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(2, 3, 6, .62); pointer-events: auto; user-select: none;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #7fd4c1;
        text-shadow: 0 0 1px rgba(200,255,240,.9), 0 0 6px rgba(127,212,193,.55), 0 0 14px rgba(127,212,193,.25);
      }
      #menu.open { display: flex; }
      #menu .menu-panel {
        border: 1px solid currentColor; background: rgba(5, 6, 10, .88); padding: 18px 26px 16px;
        min-width: 360px; max-height: 92vh; overflow-y: auto;
      }
      #menu .menu-title { font-size: 22px; letter-spacing: .22em; font-weight: 700; text-align: center; }
      #menu .menu-sub { text-align: center; opacity: .5; letter-spacing: .18em; margin-bottom: 14px; }
      #menu .menu-head { letter-spacing: .18em; opacity: .55; margin: 12px 0 6px; border-bottom: 1px solid rgba(127,212,193,.25); }
      #menu .menu-key { display: flex; gap: 14px; line-height: 1.7; }
      #menu .menu-key-cap { width: 58px; text-align: right; color: #eafff7; font-weight: 700; flex: none; }
      #menu .menu-key-act { opacity: .85; }
      #menu .menu-setting { display: flex; align-items: center; gap: 10px; line-height: 1.9; }
      #menu .menu-setting-label { width: 100px; opacity: .85; flex: none; }
      #menu .menu-setting-value { min-width: 190px; text-align: center; color: #eafff7; }
      #menu .menu-btn {
        font: inherit; color: inherit; background: none; border: 1px solid rgba(127,212,193,.5);
        width: 26px; height: 22px; line-height: 1; cursor: pointer; padding: 0; text-shadow: inherit;
      }
      #menu .menu-btn:hover { background: rgba(127,212,193,.15); }
      #menu .menu-hint { margin-top: 14px; opacity: .5; letter-spacing: .1em; text-align: center; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="menu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

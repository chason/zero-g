<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zero-g</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
      canvas { display: block; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #7fd4c1; text-shadow: 0 0 6px rgba(0,0,0,.9);
      }
      /* each instrument owns one .inst and positions itself inside the layer */
      #hud .inst { position: absolute; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

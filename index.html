<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zero-g</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
      canvas { display: block; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; overflow: hidden;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #7fd4c1; text-shadow: 0 0 6px rgba(0,0,0,.9);
      }
      /* each instrument owns one .inst and positions itself inside the layer */
      #hud .inst { position: absolute; white-space: pre; }
      /* rotation readout (#18): lower-left, where a pilot glances. Brightness tracks the
         displayed magnitude via classes the instrument toggles on each row. */
      #hud .inst-rotation { left: 16px; bottom: 16px; }
      #hud .inst-rotation .rot-head { opacity: .55; }
      #hud .inst-rotation .rate-dim { opacity: .45; }
      #hud .inst-rotation .rate-live { opacity: 1; }
      #hud .inst-rotation .rate-alert { opacity: 1; color: #ffb347; font-weight: 700; }
      /* #19: speed, range and closing rate relative to the target; glanced at constantly on approach */
      #hud .inst-velocity { top: 16px; left: 50%; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
      /* #22: propellant, current mass and remaining delta-v */
      #hud .inst-propellant { right: 16px; bottom: 16px; font-variant-numeric: tabular-nums; }
      #hud .inst-propellant .bar { height: 6px; margin: 2px 0; border: 1px solid currentColor; box-sizing: border-box; }
      #hud .inst-propellant .fill { height: 100%; width: 100%; background: currentColor; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
